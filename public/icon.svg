<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Indian Army Regimental Crimson / Cherry Red Background -->
    <linearGradient id="armyRedGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8A0303" />
      <stop offset="50%" stopColor="#660000" />
      <stop offset="100%" stopColor="#4A0000" />
    </linearGradient>

    <!-- App Icon Gold Border -->
    <linearGradient id="iconGoldBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="40%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <!-- Regal Bare-Metal Gold Blade Gradients -->
    <linearGradient id="goldBladeLight" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="25%" stopColor="#FEF08A" />
      <stop offset="55%" stopColor="#EAB308" />
      <stop offset="85%" stopColor="#CA8A04" />
      <stop offset="100%" stopColor="#854D0E" />
    </linearGradient>

    <linearGradient id="goldBladeDark" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FACC15" />
      <stop offset="45%" stopColor="#CA8A04" />
      <stop offset="80%" stopColor="#78350F" />
      <stop offset="100%" stopColor="#451A03" />
    </linearGradient>

    <!-- Blade Spine Chrome Sheen -->
    <linearGradient id="bladeSpineSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95" />
      <stop offset="50%" stopColor="#FEF08A" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#78350F" stopOpacity="0.3" />
    </linearGradient>

    <!-- Subtle Military Shadow -->
    <filter id="swordDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodColor="#000000" floodOpacity="0.65" />
    </filter>
  </defs>

  <!-- Regimental Indian Army Red Rounded Canvas (For App Icon / Home Screen) -->
  <rect width="512" height="512" rx="115" fill="url(#armyRedGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" stroke="url(#iconGoldBorder)" stroke-width="4" stroke-opacity="0.85" />

  <!-- =========================================================================
      SWORD 1: Top-Left Curve to Bottom-Right Hilt (Crossing Under)
      Authentic Bare-Metal Indian Cavalry Sabre / Talwar
      ========================================================================= -->
  <g filter="url(#swordDropShadow)">
    <!-- Curved Blade Body -->
    <path
      d="M 95 125 
         C 115 105, 175 122, 235 168
         C 300 218, 360 292, 385 352
         L 362 368
         C 338 308, 275 235, 215 190
         C 155 145, 105 132, 95 125 Z"
      fill="url(#goldBladeLight)"
    />

    <!-- Blade Spine Bevel & Ridge -->
    <path
      d="M 95 125 
         C 115 105, 175 122, 235 168
         C 300 218, 360 292, 385 352"
      stroke="url(#bladeSpineSheen)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Crossguard (Indian Talwar Quillon with End Knobs) -->
    <path
      d="M 350 330 L 415 382 L 405 395 L 340 342 Z"
      fill="url(#goldBladeDark)"
      stroke="#451A03"
      stroke-width="2"
    />
    <circle cx="345" cy="336" r="8" fill="url(#goldBladeLight)" />
    <circle cx="410" cy="388" r="8" fill="url(#goldBladeLight)" />

    <!-- Grip -->
    <line
      x1="375"
      y1="360"
      x2="425"
      y2="410"
      stroke="url(#goldBladeDark)"
      stroke-width="22"
      stroke-linecap="round"
    />
    <!-- Wire Wraps -->
    <line x1="388" y1="365" x2="378" y2="375" stroke="#451A03" stroke-width="3" />
    <line x1="400" y1="377" x2="390" y2="387" stroke="#451A03" stroke-width="3" />
    <line x1="412" y1="389" x2="402" y2="399" stroke="#451A03" stroke-width="3" />

    <!-- Traditional Disc Pommel -->
    <ellipse
      cx="440"
      cy="425"
      rx="28"
      ry="16"
      transform="rotate(45 440 425)"
      fill="url(#goldBladeLight)"
      stroke="#78350F"
      stroke-width="3"
    />
    <circle cx="450" cy="435" r="6" fill="#FFFBEB" />
  </g>

  <!-- =========================================================================
      SWORD 2: Top-Right Curve to Bottom-Left Hilt (Crossing Over)
      ========================================================================= -->
  <g filter="url(#swordDropShadow)">
    <!-- Curved Blade Body -->
    <path
      d="M 417 125 
         C 397 105, 337 122, 277 168
         C 212 218, 152 292, 127 352
         L 150 368
         C 174 308, 237 235, 297 190
         C 357 145, 407 132, 417 125 Z"
      fill="url(#goldBladeLight)"
    />

    <!-- Blade Spine Bevel & Ridge -->
    <path
      d="M 417 125 
         C 397 105, 337 122, 277 168
         C 212 218, 152 292, 127 352"
      stroke="url(#bladeSpineSheen)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Crossguard -->
    <path
      d="M 162 330 L 97 382 L 107 395 L 172 342 Z"
      fill="url(#goldBladeDark)"
      stroke="#451A03"
      stroke-width="2"
    />
    <circle cx="167" cy="336" r="8" fill="url(#goldBladeLight)" />
    <circle cx="102" cy="388" r="8" fill="url(#goldBladeLight)" />

    <!-- Grip -->
    <line
      x1="137"
      y1="360"
      x2="87"
      y2="410"
      stroke="url(#goldBladeDark)"
      stroke-width="22"
      stroke-linecap="round"
    />
    <!-- Wire Wraps -->
    <line x1="124" y1="365" x2="134" y2="375" stroke="#451A03" stroke-width="3" />
    <line x1="112" y1="377" x2="122" y2="387" stroke="#451A03" stroke-width="3" />
    <line x1="100" y1="389" x2="110" y2="399" stroke="#451A03" stroke-width="3" />

    <!-- Traditional Disc Pommel -->
    <ellipse
      cx="72"
      cy="425"
      rx="28"
      ry="16"
      transform="rotate(-45 72 425)"
      fill="url(#goldBladeLight)"
      stroke="#78350F"
      stroke-width="3"
    />
    <circle cx="62" cy="435" r="6" fill="#FFFBEB" />
  </g>
</svg>
