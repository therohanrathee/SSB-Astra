<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Authentic Indian Army Regimental Crimson Field -->
    <linearGradient id="armyCrimsonRed" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#990000" />
      <stop offset="50%" stopColor="#7A0000" />
      <stop offset="100%" stopColor="#550000" />
    </linearGradient>

    <!-- Outer Gold Border -->
    <linearGradient id="borderGold" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF099" />
      <stop offset="40%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <!-- Metallic Gold Facet Gradients for Straight Military Broadswords -->
    <linearGradient id="bladeFacetLight" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFDF0" />
      <stop offset="25%" stopColor="#FEF08A" />
      <stop offset="60%" stopColor="#EAB308" />
      <stop offset="90%" stopColor="#CA8A04" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>

    <linearGradient id="bladeFacetDark" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FACC15" />
      <stop offset="45%" stopColor="#CA8A04" />
      <stop offset="80%" stopColor="#854D0E" />
      <stop offset="100%" stopColor="#451A03" />
    </linearGradient>

    <linearGradient id="spineGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95" />
      <stop offset="60%" stopColor="#FEF08A" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#CA8A04" stopOpacity="0.3" />
    </linearGradient>

    <!-- Soft Military Depth Shadow -->
    <filter id="swordShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodColor="#000000" floodOpacity="0.7" />
    </filter>
  </defs>

  <!-- Regimental Red Shield Background for App Icon & PWA -->
  <rect width="512" height="512" rx="115" fill="url(#armyCrimsonRed)" />
  <rect x="8" y="8" width="496" height="496" rx="107" stroke="url(#borderGold)" stroke-width="4" stroke-opacity="0.85" />

  <!-- =========================================================================
      SWORD 1: From Bottom-Left Hilt (120, 392) to Top-Right Tip (412, 100)
      Indian Army Style: Hilts at bottom, straight blade pointing up/out
      ========================================================================= -->
  <g filter="url(#swordShadow)">
    <!-- Spherical Pommel -->
    <circle cx="106" cy="406" r="18" fill="url(#bladeFacetLight)" stroke="#582C0E" stroke-width="3.5" />

    <!-- Grip Handle with Wire Bindings -->
    <line x1="118" y1="394" x2="166" y2="346" stroke="url(#bladeFacetDark)" stroke-width="19" stroke-linecap="round" />
    <line x1="128" y1="378" x2="138" y2="388" stroke="#451A03" stroke-width="3" />
    <line x1="142" y1="364" x2="152" y2="374" stroke="#451A03" stroke-width="3" />
    <line x1="156" y1="350" x2="166" y2="360" stroke="#451A03" stroke-width="3" />

    <!-- Crossguard Bar with Ball Finials -->
    <line x1="200" y1="312" x2="136" y2="376" stroke="url(#bladeFacetLight)" stroke-width="13" stroke-linecap="round" />
    <circle cx="203" cy="309" r="9" fill="url(#bladeFacetDark)" />
    <circle cx="133" cy="379" r="9" fill="url(#bladeFacetDark)" />

    <!-- Straight Double-Edged Blade: Top/Left Facet (Bright) -->
    <path d="M 168 344 L 157 333 L 401 89 L 412 100 Z" fill="url(#bladeFacetLight)" />
    <!-- Straight Double-Edged Blade: Bottom/Right Facet (Dark) -->
    <path d="M 168 344 L 179 355 L 423 111 L 412 100 Z" fill="url(#bladeFacetDark)" />

    <!-- Center Spine Ridge -->
    <line x1="168" y1="344" x2="412" y2="100" stroke="url(#spineGleam)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- =========================================================================
      SWORD 2: From Bottom-Right Hilt (392, 392) to Top-Left Tip (100, 100)
      Passing OVER at center
      ========================================================================= -->
  <g filter="url(#swordShadow)">
    <!-- Spherical Pommel -->
    <circle cx="406" cy="406" r="18" fill="url(#bladeFacetLight)" stroke="#582C0E" stroke-width="3.5" />

    <!-- Grip Handle with Wire Bindings -->
    <line x1="394" y1="394" x2="346" y2="346" stroke="url(#bladeFacetDark)" stroke-width="19" stroke-linecap="round" />
    <line x1="384" y1="378" x2="374" y2="388" stroke="#451A03" stroke-width="3" />
    <line x1="370" y1="364" x2="360" y2="374" stroke="#451A03" stroke-width="3" />
    <line x1="356" y1="350" x2="346" y2="360" stroke="#451A03" stroke-width="3" />

    <!-- Crossguard Bar with Ball Finials -->
    <line x1="312" y1="312" x2="376" y2="376" stroke="url(#bladeFacetLight)" stroke-width="13" stroke-linecap="round" />
    <circle cx="309" cy="309" r="9" fill="url(#bladeFacetDark)" />
    <circle cx="379" cy="379" r="9" fill="url(#bladeFacetDark)" />

    <!-- Straight Double-Edged Blade: Top/Right Facet (Bright) -->
    <path d="M 344 344 L 355 333 L 111 89 L 100 100 Z" fill="url(#bladeFacetLight)" />
    <!-- Straight Double-Edged Blade: Bottom/Left Facet (Dark) -->
    <path d="M 344 344 L 333 355 L 89 111 L 100 100 Z" fill="url(#bladeFacetDark)" />

    <!-- Center Spine Ridge -->
    <line x1="344" y1="344" x2="100" y2="100" stroke="url(#spineGleam)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
