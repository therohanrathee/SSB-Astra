<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Tactical Midnight Camo -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#141C12" />
      <stop offset="50%" stopColor="#0B0F0A" />
      <stop offset="100%" stopColor="#050805" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#65A30D" />
      <stop offset="40%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#2D3B2A" />
    </linearGradient>

    <!-- Steel Blade Gradient -->
    <linearGradient id="steelBlade" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#E2E8F0" />
      <stop offset="65%" stopColor="#94A3B8" />
      <stop offset="100%" stopColor="#475569" />
    </linearGradient>

    <!-- Blade Dark Edge -->
    <linearGradient id="steelBladeDark" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#CBD5E1" />
      <stop offset="60%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>

    <!-- Polished Gold Gradient for Hilts and Crest -->
    <linearGradient id="goldPolish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="35%" stopColor="#FACC15" />
      <stop offset="70%" stopColor="#CA8A04" />
      <stop offset="100%" stopColor="#854D0E" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" floodColor="#EAB308" floodOpacity="0.45" />
    </filter>

    <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#000000" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Background Shield / Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Subtle Tactical Radar Rings -->
  <circle cx="256" cy="256" r="190" stroke="#65A30D" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="120" stroke="#EAB308" stroke-width="1" stroke-opacity="0.2" />

  <!-- =========================================================================
      SWORD 1: Diagonal Top-Left to Bottom-Right
      ========================================================================= -->
  <g filter="url(#bladeShadow)">
    <!-- Upper Blade Half (Bright Edge) -->
    <path d="M 88 88 L 138 108 L 336 306 L 316 336 L 108 138 Z" fill="url(#steelBlade)" />
    <!-- Lower Blade Half (Shadowed Edge) -->
    <path d="M 88 88 L 108 138 L 316 336 L 336 306 Z" fill="url(#steelBladeDark)" />

    <!-- Center Fuller (Blood groove) -->
    <line x1="88" y1="88" x2="322" y2="322" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Quillon / Guard -->
    <path d="M 296 368 C 328 344, 352 328, 368 296 C 378 306, 380 316, 368 328 L 328 368 C 316 380, 306 378, 296 368 Z"
          fill="url(#goldPolish)" stroke="#78350F" stroke-width="3" />

    <!-- Grip with wire ribs -->
    <line x1="332" y1="332" x2="408" y2="408" stroke="url(#goldPolish)" stroke-width="26" stroke-linecap="round" />
    <line x1="348" y1="332" x2="332" y2="348" stroke="#451A03" stroke-width="4" />
    <line x1="368" y1="352" x2="352" y2="368" stroke="#451A03" stroke-width="4" />
    <line x1="388" y1="372" x2="372" y2="388" stroke="#451A03" stroke-width="4" />

    <!-- Pommel -->
    <circle cx="420" cy="420" r="20" fill="url(#goldPolish)" stroke="#78350F" stroke-width="4" />
  </g>

  <!-- =========================================================================
      SWORD 2: Diagonal Top-Right to Bottom-Left
      ========================================================================= -->
  <g filter="url(#bladeShadow)">
    <!-- Upper Blade Half (Bright Edge) -->
    <path d="M 424 88 L 404 138 L 196 336 L 176 306 L 374 108 Z" fill="url(#steelBlade)" />
    <!-- Lower Blade Half (Shadowed Edge) -->
    <path d="M 424 88 L 374 108 L 176 306 L 196 336 Z" fill="url(#steelBladeDark)" />

    <!-- Center Fuller -->
    <line x1="424" y1="88" x2="190" y2="322" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Quillon / Guard -->
    <path d="M 216 368 C 184 344, 160 328, 144 296 C 134 306, 132 316, 144 328 L 184 368 C 196 380, 206 378, 216 368 Z"
          fill="url(#goldPolish)" stroke="#78350F" stroke-width="3" />

    <!-- Grip with wire ribs -->
    <line x1="180" y1="332" x2="104" y2="408" stroke="url(#goldPolish)" stroke-width="26" stroke-linecap="round" />
    <line x1="164" y1="332" x2="180" y2="348" stroke="#451A03" stroke-width="4" />
    <line x1="144" y1="352" x2="160" y2="368" stroke="#451A03" stroke-width="4" />
    <line x1="124" y1="372" x2="140" y2="388" stroke="#451A03" stroke-width="4" />

    <!-- Pommel -->
    <circle cx="92" cy="420" r="20" fill="url(#goldPolish)" stroke="#78350F" stroke-width="4" />
  </g>

  <!-- =========================================================================
      POLISHED GOLD CENTRAL STAR CREST
      ========================================================================= -->
  <g filter="url(#goldGlow)">
    <!-- 8-Pointed Star of Valour -->
    <path d="M 256 200 L 274 238 L 312 256 L 274 274 L 256 312 L 238 274 L 200 256 L 238 238 Z"
          fill="url(#goldPolish)" stroke="#78350F" stroke-width="4" />
    <!-- Center Diamond Highlight -->
    <polygon points="256,224 266,246 288,256 266,266 256,288 246,266 224,256 246,246" fill="#FFFBEB" />
    <circle cx="256" cy="256" r="6" fill="#F59E0B" />
  </g>
</svg>
